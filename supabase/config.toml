# Supabase CLI configuration (local development and `supabase db push` / `functions deploy`).
# Hosted-project settings (auth providers, network restrictions, …) live in the dashboard.
project_id = "pinched-app"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
# Match the hosted project's Postgres major version.
major_version = 17

[db.migrations]
enabled = true

# The seeded recipe catalog (generated by `pnpm catalog:build`; never edit by hand).
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[storage]
enabled = true
# The recipe-media bucket (see migrations) caps files at 50 MiB; this is the project-wide ceiling.
file_size_limit = "50MiB"

# Clerk signs people in; Supabase trusts Clerk session tokens (Third-Party Auth). Enable it in the
# dashboard (Authentication → Sign In / Up → Third-Party Auth → Clerk) for a hosted project. For
# `supabase start`, uncomment and set your Clerk frontend API domain:
# [auth.third_party.clerk]
# enabled = true
# domain = "your-app.clerk.accounts.dev"

# Reminders are triggered by pg_cron with a shared secret (see supabase/cron/send-reminders.sql),
# not by a Supabase user token, so the gateway's JWT check is off for this function.
[functions.send-reminders]
enabled = true
verify_jwt = false
